# Fill this in before you submit -- our evaluator runs these commands
# EXACTLY as written, in this order, from a fresh checkout of your fork.
# Keep every command non-interactive (no prompts) and idempotent.

setup_commands:
  - "pip install -r requirements.txt"

run_commands:
  - "python src/main.py --help"
  # the multi-agent workflow on two real encode/httpx scenarios
  # -> prints reports; writes out/demo/*/{report.md, docs.patch, findings.json, trace.jsonl}
  - "python src/main.py demo --llm replay"
  # evaluation: historical replay vs ground truth + mutation benchmark -> eval/results.md
  - "python src/main.py eval --llm replay"
  # docs served from code: API search, and checking a stale snippet against the current API
  - "python src/main.py ask how do I use a client certificate"
  - "python src/main.py check examples/snippet_with_stale_api.py --head-dir examples/httpx/0.28.1"
  # CI-style scan of released httpx 0.28.1 docs (uses live Claude via `claude -p` if CLAUDE_KEY is set, else replay)
  - "python src/main.py scan --base-dir examples/httpx/0.28.0 --head-dir examples/httpx/0.28.1 --package httpx --fail-on never --out out/scan"

test_commands:
  - "python -m pytest -q"

notes: "Python >= 3.9 and git; no runtime dependencies beyond the standard library (requirements.txt only installs pytest). No network needed: the example repo (encode/httpx at tags 0.27.2/0.28.0/0.28.1, BSD-3) is vendored under examples/, and the reasoning agent's claude -p answers are replayed from cassettes/ so results are deterministic and free. The final scan uses mode 'auto': if CLAUDE_KEY is set and the claude CLI is installed it calls Claude live (~$0.02, ~15 s) and records new cassettes; otherwise it replays. Whole run takes under a minute offline. Write-up: docs/WRITEUP.md; results: eval/results.md."
